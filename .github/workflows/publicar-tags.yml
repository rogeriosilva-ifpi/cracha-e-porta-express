# Auxiliar de publicação: cria as tags capNN no GitHub a partir da lista.
# Removido logo depois do uso.
name: publicar-tags
on:
  push:
    branches: [main]
    paths: [".github/tags-publicacao.txt"]
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          while read -r tag sha; do
            [ -n "$tag" ] && git tag -f "$tag" "$sha"
          done < .github/tags-publicacao.txt
          git push origin --tags --force
          git ls-remote --tags origin | wc -l
